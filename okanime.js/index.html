        <script type="text/javascript">

            /**
             * Animator (class like)
             */
            function Animator(callback) {
                const self = this;
                let requestId = null;

                /**
                 * get request id
                 * @return requestId
                 */
                self.getRequestId = () => requestId;

                /**
                 * start tick.
                 */
                self.start = function() {
                    if(!requestId) {
                        let lastTimestamp = null;
                        requestId = requestAnimationFrame(tick);
                        if(self.onTickStarted) {
                            self.onTickStarted(requestId);
                        }
                        function tick(timestamp) {
                            const elapsed = timestamp - (lastTimestamp || timestamp);
                            lastTimestamp= timestamp;
                            if(self.onTickEvent) {
                                self.onTickEvent(timestamp, elapsed, requestId);
                            }
                            requestId = requestAnimationFrame(tick);
                        }
                    }
                }
                /**
                 * stop tick.
                 */
                self.stop = function() {
                    if(requestId) {
                        cancelAnimationFrame(requestId);
                        requestId = null;
                    }
                }
            }

            /**
             * 日時文字列 
             */
            function dateString() {
                return new Date().toLocaleString(undefined, {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit'});
            }

            // 初期化
            window.addEventListener('load', function() {
                let isPaused = false;
                // settings
                (function() {
                    document.querySelector('#buttonStart').addEventListener('click', function() {
                        massageLog('clicked start button.');
                        isPaused = false;
                    })
                    document.querySelector('#buttonStop').addEventListener('click', function() {
                        massageLog('clicked stop button.');
                        isPaused = true;
                    })
                    document.querySelector('#buttonReset').addEventListener('click', function() {
                        massageLog('clicked reset button.');
                    })
                })();

                /**
                 * update. (instance)
                 * @param delta milisec
                 * @param time performance.now()
                 */
                const update = function(delta, time) {
                    const deltaSec = delta / 1000;
                    // massageLog(`tick. time = ${time}, delta = ${delta}`);

                    // generator
                    (function() {
                        
                    })();

                    // projector
                    (function() {
                        const circle = document.querySelector('#progressProjector');
                        if(circle) {
                            const count = Number(circle.getAttribute('data-count')) || 0;
                            if(count) {
                                const max = Number(circle.getAttribute('data-max')) || count;
                                const newCount = Math.max(count - delta, 0);
                                setRingProgress(circle, (max - newCount) / max);
                                circle.setAttribute('data-count', newCount);
                                if(newCount == 0) {
                                    massageLog('projection!');
                                }
                            } else {
                                const max = 4000 + (Math.random() * 2000);
                                setRingProgress(circle, 0);
                                circle.setAttribute('data-count', max);
                                circle.setAttribute('data-max', max);
                            }
                        }
                    })();

                    // file object
                    (function() {
                        const MAX_COUNT = 500;
                        document.querySelectorAll('div.fileContainer').forEach(function(divContainer) {
                            divContainer.querySelectorAll('div.fileObject').forEach(function(divFile, index) {
                                const i = Math.floor(index % 2);
                                const j = Math.floor(index / 2);

                                const count = divFile.getAttribute('data-count');
                                if(divFile.getAttribute('data-count') !== 0) {
                                    const getValue = (a, b, isForce) => {
                                        if(isForce) {
                                            return b
                                        } else if(a) {
                                            return a;
                                        } else if(a == 0) {
                                            return a;
                                        } else {
                                            return b;
                                        }
                                    };
                                    const isSame = ((divFile.getAttribute('data-index') || -1) == index);
                                    const curCount = isSame ? count : MAX_COUNT;
                                    const startPosX = getValue(divFile.getAttribute('data-start-pos-x'), divFile.offsetLeft, !isSame);
                                    const startPosY = getValue(divFile.getAttribute('data-start-pos-y'), divFile.offsetTop, !isSame);
                                    const nextCount = Math.max(curCount - delta, 0);

                                    const tgtX = i * 100;
                                    const tgtY = j * 100;

                                    const top = tgtY - ((tgtY - startPosY) * curCount / MAX_COUNT);
                                    const left = tgtX - ((tgtX - startPosX) * curCount / MAX_COUNT);

                                    divFile.style.top = top;
                                    divFile.style.left = left;
                                    divFile.setAttribute('data-index', index);
                                    divFile.setAttribute('data-count', nextCount);
                                    if(nextCount) {
                                        divFile.setAttribute('data-start-pos-x', startPosX);
                                        divFile.setAttribute('data-start-pos-y', startPosY);
                                    } else {
                                        divFile.removeAttribute('data-start-pos-x');
                                        divFile.removeAttribute('data-start-pos-y');
                                    }
                                }
                            });
                        });
                    })();
                };


                // start
                (function(){
                    let lastTime = 0;
                    requestAnimationFrame(mainloop);
                
                    function mainloop(time) {
                        const MAX_DELTA = 100;
                        const delta = Math.min(time - lastTime, MAX_DELTA);
                        if(!isPaused) {
                            update(delta, time);
                        }
                        requestAnimationFrame(mainloop);
                        lastTime = time;
                    }
                })();

                /**
                 * @param str
                 */
                function massageLog(str) {
                    const timestamp = dateString();
                    document.querySelectorAll('#logSettings').forEach(function(logarea) {
                        const div = document.createElement('div');
                        div.textContent = `[${timestamp}] ${str}`;
                        while(logarea.childNodes.length >= 100) {
                            logarea.childNodes[logarea.childNodes.length - 1].remove();
                        }
                        logarea.prepend(div);
                    });
                }

                /**
                 * ring progress
                 * @param circle
                 * @param v
                 */
                function setRingProgress(circle, v) {
                    const radius = circle.r.baseVal.value;
                    const circumference = 2 * Math.PI * radius; // 外周：約339.29
                    const offset = circumference - (v * circumference);
                    circle.style.strokeDashoffset = offset;
                }

            });
        </script>
